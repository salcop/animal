<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#222d32"><title>퀴즈농장</title><style>

pe":"multiple_choice","difficulty":3,"question":"23 × 49의 값은?","choices":["1127","1104","1176","1137"],"answer":0,"explanation":"23×49=1127이다.","status":"REVIEW"},{"id":"QF2-00000989","category":"brain","type":"multiple_choice","difficulty":1,"question":"65에서 25를 빼면?","choices":["40","41","45","37"],"answer":0,"explanation":"65-25=40이다.","status":"REVIEW"},{"id":"QF2-00000990","category":"brain","type":"multiple_choice","difficulty":2,"question":"2736 ÷ 48의 값은?","choices":["105","59","56","57"],"answer":3,"explanation":"2736÷48=57이다.","status":"REVIEW"},{"id":"QF2-00000991","category":"brain","type":"multiple_choice","difficulty":3,"question":"130의 50%는?","choices":["65","130","70","60"],"answer":0,"explanation":"130×50/100=65이다.","status":"REVIEW"},{"id":"QF2-00000992","category":"brain","type":"multiple_choice","difficulty":2,"question":"가로 67cm, 세로 9cm인 직사각형의 둘레는?","choices":["152","76","603","286"],"answer":0,"explanation":"둘레는 2×(67+9)=152cm이다.","status":"REVIEW"},{"id":"QF2-00000993","category":"brain","type":"multiple_choice","difficulty":1,"question":"72 + 45의 값은?","choices":["115","127","120","117"],"answer":3,"explanation":"72+45=117이다.","status":"REVIEW"},{"id":"QF2-00000994","category":"brain","type":"multiple_choice","difficulty":3,"question":"89 × 21의 값은?","choices":["1879","1869","1890","1780"],"answer":1,"explanation":"89×21=1869이다.","status":"REVIEW"},{"id":"QF2-00000995","category":"brain","type":"multiple_choice","difficulty":1,"question":"63에서 44를 빼면?","choices":["16","24","19","20"],"answer":2,"explanation":"63-44=19이다.","status":"REVIEW"},{"id":"QF2-00000996","category":"brain","type":"multiple_choice","difficulty":2,"question":"720 ÷ 20의 값은?","choices":["36","56","35","38"],"answer":0,"explanation":"720÷20=36이다.","status":"REVIEW"},{"id":"QF2-00000997","category":"brain","type":"multiple_choice","difficulty":3,"question":"220의 10%는?","choices":["44","27","22","17"],"answer":2,"explanation":"220×10/100=22이다.","status":"REVIEW"},{"id":"QF2-00000998","category":"brain","type":"multiple_choice","difficulty":2,"question":"가로 70cm, 세로 8cm인 직사각형의 둘레는?","choices":["78","560","296","156"],"answer":3,"explanation":"둘레는 2×(70+8)=156cm이다.","status":"REVIEW"},{"id":"QF2-00000999","category":"brain","type":"multiple_choice","difficulty":1,"question":"51 + 17의 값은?","choices":["66","71","78","68"],"answer":3,"explanation":"51+17=68이다.","status":"REVIEW"},{"id":"QF2-00001000","category":"brain","type":"multiple_choice","difficulty":3,"question":"68 × 40의 값은?","choices":["2760","2720","2652","2730"],"answer":1,"explanation":"68×40=2720이다.","status":"REVIEW"}];const $=id=>document.getElementById(id);const names={general:'상식',current:'시사',entertainment:'연예',science:'과학',history:'역사',culture:'문화',sports:'스포츠',brain:'두뇌'};let state=null,interval=null;const rand=n=>Math.floor(Math.random()*n);const shuffle=a=>{for(let i=a.length-1;i>0;i--){let j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function show(id){document.querySelectorAll('.screen').forEach(e=>e.classList.toggle('active',e.id===id))}function modal(markup){$('modal').innerHTML=markup;$('overlay').classList.add('show')}function closeModal(){$('overlay').classList.remove('show')}function pick(){const cat=$('cat').value;let pool=BANK.filter(x=>cat==='all'||x.category===cat);shuffle(pool);let len=Number($('length').value);let mc=pool.filter(x=>x.type==='multiple_choice'),ox=pool.filter(x=>x.type==='ox');let take=[...mc.slice(0,Math.round(len*.8)),...ox.slice(0,len-Math.round(len*.8))];if(take.length<len){const ids=new Set(take.map(x=>x.id));take.push(...pool.filter(x=>!ids.has(x.id)).slice(0,len-take.length))}return shuffle(take)}
function start(){clearInterval(interval);closeModal();let questions=pick();state={questions,i:0,score:0,lives:2,correct:0,mode:$('mode').value,locked:false,history:[],npc:[{name:'양',lives:2,score:0},{name:'오리',lives:2,score:0},{name:'염소',lives:2,score:0},{name:'돼지',lives:2,score:0}]};show('game');renderQuestion()}
function chars(){let all=[{name:'나',lives:state.lives,mine:true},...(state.mode==='survival'?state.npc:[])];$('characters').innerHTML=all.map((c,i)=>`<div class="character ${c.mine?'mine':''} ${c.lives<=0?'ghost':''}" style="animation-delay:${i*.12}s"><div class="head"><span class="ears">${['🐑','🐥','🐐','🐷','🐶'][i%5]}</span><span class="face">··</span></div><div class="bodyblob"></div><div class="nametag">${esc(c.name)} ${c.lives>0?'♥'.repeat(c.lives):'👻'}</div></div>`).join('')}
function renderQuestion(){clearInterval(interval);if(state.i>=state.questions.length||state.lives<=0){finish();return}let q=state.questions[state.i];state.locked=false;$('round').textContent=`${state.i+1} / ${state.questions.length}`;$('score').textContent=state.score+'점';$('life').textContent=state.mode==='practice'?'연습':'♥'.repeat(state.lives);$('category').textContent=names[q.category]||q.category;$('difficulty').textContent='★'.repeat(q.difficulty);$('question').textContent=q.question;$('feedback').textContent='정답을 골라 우리로 이동!';let choices=q.type==='ox'?['O','X']:q.choices;$('answers').innerHTML=choices.map((c,i)=>`<button class="choice" data-i="${i}">${esc(c)}</button>`).join('');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answer(Number(b.dataset.i)));chars();let duration=15000;let end=Date.now()+duration;function tick(){let remaining=Math.max(0,end-Date.now());$('clock').textContent=Math.ceil(remaining/1000)+'초';$('bar').style.width=(remaining/duration*100)+'%';if(remaining<=0){clearInterval(interval);answer(-1)}}tick();interval=setInterval(tick,100)}
function answer(n){if(state.locked)return;state.locked=true;clearInterval(interval);let q=state.questions[state.i],right=n===q.answer;state.history.push({id:q.id,right,chosen:n});if(right){state.correct++;state.score+=q.difficulty*10}else if(state.mode==='survival'){state.lives--}document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;let i=Number(b.dataset.i);if(i===q.answer)b.classList.add('correct');else if(i===n)b.classList.add('wrong')});if(state.mode==='survival'){state.npc.forEach(p=>{if(p.lives>0){if(Math.random()<.68)p.score+=q.difficulty*10;else p.lives--}})}let correct=q.type==='ox'?(q.answer===0?'O':'X'):q.choices[q.answer];$('feedback').textContent=(right?'정답! 🎉':'오답! 🐷')+' 정답: '+correct;chars();setTimeout(()=>{state.i++;renderQuestion()},1700)}
function finish(){clearInterval(interval);let ranked=[{name:'나',score:state.score},...(state.mode==='survival'?state.npc:[])].sort((a,b)=>b.score-a.score);let rank=ranked.findIndex(x=>x.name==='나')+1;modal(`<h2 style="text-align:center">🌾 오늘의 수확</h2><p style="text-align:center;font-weight:900;font-size:24px">${state.score}점 · ${state.correct}/${state.history.length} 정답</p>${state.mode==='survival'?`<p style="text-align:center">${rank}위 / ${ranked.length}명 (로컬 NPC)</p>`:''}<p style="text-align:center">틀린 문제도 다시 도전해봐!</p><button class="btn" onclick="start()">다시 플레이</button><button class="btn secondary" onclick="closeModal();show('home')">농장 나가기</button>`)}
$('start').onclick=start;$('menu').onclick=()=>{clearInterval(interval);modal('<h3>농장 메뉴</h3><button class="btn" onclick="closeModal();renderQuestion()">게임 계속</button><button class="btn secondary" onclick="closeModal();show(\'home\')">메인으로 (진행 초기화)</button><p style="font-size:12px">현재는 오프라인 싱글 플레이 및 NPC 모드입니다. 실시간 P2P 멀티플레이는 구현되지 않았습니다.</p>')};document.addEventListener('visibilitychange',()=>{if(document.hidden&&state&&!state.locked&&$('game').classList.contains('active')){clearInterval(interval);modal('<h3>일시정지</h3><button class="btn" onclick="closeModal();renderQuestion()">계속하기</button>')}});
</script></body></html>
